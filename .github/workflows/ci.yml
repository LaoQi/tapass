name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: tools — 格式 / vet / test
        working-directory: tools
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化（gofmt -l）："
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test ./... -count=1 -timeout 300s

      - name: tui — 格式 / vet / test
        working-directory: tui
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化（gofmt -l）："
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test ./... -count=1 -timeout 300s

      - name: 交叉编译冒烟（windows/amd64）
        run: |
          cd tools && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
          cd ../tui && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...

      - name: 交叉编译冒烟（linux/arm64）
        run: |
          cd tools && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
          cd ../tui && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
